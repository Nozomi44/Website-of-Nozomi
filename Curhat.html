      const textsByDate = {
        "13 September 2024": "Hallo Sabina 😊 Kapanpun kamu membuka dan membaca pesan ini Terimakasih sudah menyempatkan untuk membuka website ini, Gimana wawancara daftar PT nya? semoga dilancarkan sampe kamu lulus ya Aamiin, Sejujurnya aku tuh ngerasa sedih denger kamu mau kerja dan pindah jadi anak malem, Karena percaya nggak percaya kamu itu udah jadi salah satu sumber energi aku dalam perkuliahan selama ini, Oh iya aku hampir lupa hehe ini adalah website khusus curahan hati aku yang akan aku sampaikan terus disini karena jujur aku masih nggak bisa ngelawan ketakutan dan besarnya rasa malu dalam diriku untuk nyampein nya secara langsung ke kamu, Sejujurnya kemarin aku pengen Ngajak kamu dan nanyain boleh apa enggak aku menelpon kamu? tapi karena aku orangnya terlalu memikirkan segalanya takutnya kamu risih apa gimana jadi aku memutuskan untuk tidak melakukannya, Pesan ini nggak akan berakhir secara singkat pastinya mengandung semua curahan hatiku selama di Cikarang ini dan bertemu kamu :), Pelajaran tadi pagi lumayan seru tapi disanyangkan nya kamu nggak ada tadi :( tapi allhamdulilah tadi dosen nya Pak Rizaldi katanya buat hari ini dianggap hadir aja semuanya walaupun ada yang nggak hadir, Sebelum itu alangkah baiknya kita putar waktu ke 2023 cekidottt.",
        "09 September 2023": "Aku memulai petualangan merantau di Cikarang, pada tanggal ini aku datang ke Cikarang untuk wawancara beasiswa allhamdulillah walaupun nggak full aku tetep dapet 75%, Awalnya aku aku kepanasan banget di CIkarang ini karena penyesuaian dari Garut yang biasa 10-20 Derajat Celcius pindah ke Cikarang yang rata-rata 30-40 setiap harinya.",
        "10 September 2023": "Hari pertama tidak selama hari kedua, karena hari kedua ini aku diam di Kontrakan dengna tidak membawa persiapan apapun dari kampung halaman, Akhirnya aku berjalan dari tempat kontrakan ku ke Pasar Serang dengan matas yang sangat nyentrik untuk membeli peralatan survive dan aku PP jalan kaki di hari kedua itu, Aku belum kenal siapa-siapa di Cikarang ini karena aku datang jauh-jauh dari Garut yang tadinya hanya untuk wawancara beasiswa saja ttb langsug menetap disini tanpa pulang lagi.",
        "11 September 2023": "Hari ini aku dihubungi dari pihak kampus bahwa ada mahasiswa lain juga yang mau nge kost bareng disini dan tidak lain tidak bukan orang itu adalah Rehan, ya di hari itu aku nungguin dia di depan kampus buat ngajak dia liat-liat dulu kontrakan yang mau dia tinggali berdua denganku selama perkuliahan, setelah mengajak rehan meliat lihat kontrakan tidak terasa hari sudah larut malam saja, tidak selang lama saya dihubungi kembali untuk mengikuti kegiatan boothcamp yang sudah mau beres.",
        "12 September 2023": "12 September 2023 aku pertama kali bertemu dengan teman-teman kampus ku seumur hidup aku masuk ke ruangan boothcamp barengan dengan Rehan yang masih canggung bahkan waktu itu Aku masih baku banget ke dia 'Aku, Kamu' sekarang kan 'Gw, Lu' tapi Aku ke kamu mah itu beda cerita lagi wkwk, Aku mulai memasuki ruangan boothcamp dan duduk di paling belakang dan disanalah aku juga kenal dengan seseorang yang kedepan nya bakal jadi problem besar uat hidup aku.",
        "13 September 2023": "Hari ini aku mulai excited dengan materi boothcamp dan ingin segera masuk perkuliahan, Pada hari ini aku ditugaskan untuk menyelesaikan Hiragana & Katakana pada website E Learning Minato dan aku dengan sungguh-sungguh menyelesaikannya, sepulang dari boothcamp tidak langsung pulang nonngkrong dan ngobrol dulu bareng temen-temen yang lain sampe jam 11 san kalo gak salah, dari sana aku mengenal teman yang deket juga dengan aku dari Prodi Mekatronika yang namanya 'Bintang' aku sering main sejak kenal sama dia diajak keliling Cikarang dsb.",
        "14 September 2023": "Hari ini adalah hari yang ditunggu-tunggu karena kiriman barang-barang ku dari Kampung telah sampai, waktu itu masih belum selengkap sekarang baru ada selimut dan bantal saja untuk alas nya belum memakai kasur masih menggunakan karpet plastik yang panjang nya 5x5 kayaknya, singkat cerita semua barang-barang aku sudah aku tata dan rapiin sesuai dengan denah yang aku perkirakan , Untuk di hari ini tidak terlalu banyak cerita.",
        "15 September 2023": "Tidak terasa sudah 1 Minggu Aku tinggal di Cikarang ini, banyak banget culture shock sama kebiasaan aku yang berubah drastis semenjak kesini, di Garut aku biasa mandi sehari 1-2 kali dinisi 1 hari bisa sampe 4 kali saking gerah nya, dan pada waktu itu air disini nggak ada rasa dingin-dingin nys sumpah kayak berasa air panas yang udah anget, hari ini kebetulan hari Jum'at aku siap-siap buat Jum'atan dan ternyata waktu jum'atan pun aku culture shock juga, karena kalo dikampung halamanku itu Full Sunda atau Indonesia lah disini nggak ada Indonesia nya, full Arab semua itu juga bukan Khutbah tapi Do'a semua isinya.",
        "MAKRAB STORY 1": "Sebelumnnya perlu kamu ketahui aku itu sebenarnya jarang kontak langsung dengan Perempuan baik itu ngobrol maupun apa karena waktu SMP (MTS) aku dipisah antara kelas Cowok RG (Rijallul Ghad) dan kelas Cewek UG (Ummahatul Ghad) dan pas SMA (MA) disatuin lagi kamu bayangin lah gimana ya wkwk, Nah pas acara Makrab atau (Malam Akrab) itu kan belum terlalu akrab juga lah ya sama semuanya termasuk temen sekelas juga, Nah pas waktu itu kamu ada kan ya ikut masak-masak juga itu kesan pertama aku ngobrol langsung dengan Cewek yang baru pertama kali aku kenal, singkat cerita makrab udah mau selesai nah semuanya pada pulang dong yakan, Waktu itu kalo nggak salah Rehan udah deket ya ama Widia nah dianterin lah tuh mereka pulang duluan, sedangkan kamu dan yang lainnya juga belum pulang waktu itu karena udah malem juga yaudah Aku anterin aja kamu pulang, pas di gerbang masih inget banget aku semuanya pada neriakin 'Oooh gituuu' aku kan nggak tau apa-apa ya yaudah lanjut aja anterin kamu, nah pas dijalan mau ke rumah kamu Rehan and Yansen neriakin dari belakang sambil naik motor, 'Oooh begituu' what? nah dari sanalah aku kepikiran kamu terus takutnya kamu mikirnya sama kayak mereka😭.",
        "MAKRAB STORY 2": "Entah gimana pokoknya aku mulai ada rasa kek kamu sejak waktu itu, Waktu itu kan udah save save an nomer ya, kalo gak salah kamu hide aku dan yang lainnya karena takut nggak se frekuensi jadinya di hide, Sebenernya aku udah pesimis duluan ya liat PP kamu kayak PP Couple wkwk ditambah waktu itu pacar kamu juga kayaknya perhatian banget ke kamu, jadi aku cuman bisa sebatas mengagumi kamu saja hingga pada saat.",
        "MAKRAB STORY 3": "Aku terus menyimpan dan membungkam perasaan ku karena aku masih ada trauman dengan yang sebelumnya, kadang ketika kamu ada di kelas rasanya pengennn banget aku ajak ngobrol tapi apalah daya aku yang nggak bisa ngapa-ngapain ditambah pas saat kamu nggak masuk perkuliahan selama 1 Bulan itu bikin aku sedih banget wkwk, Saatnya kembali ke tahun sekarang 2024 Let's Go!",
        "8 Maret 2024": "Masuk ke tahun baru 2024 bulan Maret tidak disangka perayaan ulang tahunku berbarengan dengan Poloteknik Takumi ya walaupun sebenernya Takumi itu tanggal 11 Maret aku sangat berterimakasih yang udah ngerayain ultah aku khususnya yang udah patungan buat beli kue, pas waktu itu aku bingung antara mau sedih, seneng, kaget karena selama 17 tahun aku belum pernah ngerasain gimana dirayain jadinya semua perasaan ku campur aduk, pada tanggal itu juga aku mendengar kabar kalo kamu sudah Wakareru dengan kareshi kamu aku juga enggak tau harus ikut sedih apa seneng disatu sisi competitor aku ini kalah disatu sisi kamu bisa aja lagi sedih.",
        "Perencanaan Kokuhaku": "Perencanaan ini sebenernya sudah aku rancang sedemikian rupa cuman ttb saja gatot karena perasaan aku yang bimbang, sebenarnya tidak terlintas dibenak aku buat nyatain perasaan ku kekamu soalnya rasanya masih mustahil apalagi kamu baru wakareru ditambah aku juga tau kalo kamu punya tekad yang besar buat jadi penulis yang hebat, tibalah disatu hari aku yang dilanda keadaan bimbang tanpa pikir panjang aku nyatain perasaan aku kekamu mana lewat chat lagi😭 payah banget aku, aku sudah tau jawaban pastinya sebenrnya jadi disaat liat jawaban kamu aku walaupun sedih tapi enggak sampe meratapi kesedhihan (lemah banget kalo gitu) dari sana yaudah lah kayaknya aku emang nggak bisa.",
        "Perencanaan Pendekatan": "Sebenernya aku emang payah banget dalam hal kekginian karena aku langsung loncat aja ke kokuhaku tanpa adanya pendeatan dulu ke kamu jadi aku merasa emang nggak bisa soal kek ginian tapi aku belum menyerah, disatu sisi aku itu orang nya cemburuan walaupun kita bleum ada apa-apa tapi kalo ada yang sksd ke kamu rasanya gimana ya😂😂🙏, Kepikiran sih kayak ngajak jalan keluar, atau makan bareng tapi karena itu aku tuh orang nya pemalu jadi semua rencana itu tidak terealisasikan.",
        "Mengutarakan Perasaan": "Untuk part ini aku nggak beraharap banyak mengenai balasan dari kamu karena aku udah tau kecil kemungkinan nya buat kamu nerima nya apalagi orang kaya aku wkwk, tapi ternyata Jawaban kamu diluar dugaan kamu malah terima aku kek gitu dan nyruh aku buat ngutarain perasaan lagi kek kamu kalo mlagi mau? aku sebenernya bingung disini kamu udah coba membuka hati atau kamu udah nerima gitu jadi aku juga enggak bereaksi gimana-gimana (Maaf aku orang nya kurang peka).",
        "Mengutarakan Perasaan Pt.2": "Untuk itu aku enggak maksa atau gimana-gimana cuman pengen ngajak kamu doang kamu mau nggak deket dengan aku nggak apa-apa nggak pacaran coba dulu deket gimana?",
        "EXTRA STORY": "Selama hidup di Cikarang ini enggak semulus yang kamu kira banyak lika-liku dibelakang semua ini, ini ada hubungan nya dengan seseorang yang aku kasih tau pada September 2023 dan juga jadi cikal bakal satgas PPKS didiriin di Takumi ini.",
        "Part 1": "Ketika sedang bootcamp aku kenal dan mulai deket dengan satu sama lain khususnya orang ini yang dari Prodi Mekatronika (Cowok yaa) nah dia ini sejak kenal aku sering ngobrol terus ngajakin jalan keluar keliling Cikarang, Lumayan juga kan aku belum tau betul daerah sini jadi tau karena sering diajakin jalan sama dia makan juga sama dia sampe pertengahan Semester 1 semuanya masih oke-oke aja sampe suatu ketika.",
        "Part 2": "Pada hari yang cerah biasalah dia datang main jalan ke mana entah berantah daerah Cikarang lah intinya mah, sampe dia nge chat aku nah pas di chat, perlu kamu ketahui dulu dia memiliki kerpibadian ganda, nanti saya jelaskan, Pas jalan dan ngorol sama dia aku udah curiga kalo dia tuh agak laen maksudnya agak laen itu dari tingkah lakunya TIDAK MENCERIMINKAN LAYAKNYA SEORANG COWOK GITU Tingakh lakunya gemulai tau lah ya kek mana gemulai itu, dia sering banget nyenderin kepala nya di bahu aku ihhhhh takut nyooooo.",
        "Part 3": "Ujian UAS sudah menghitung hari Aku nerima chat dari dia, chatan biasa lah ya cuma kamu tau nggak yang bikin aku nggak nyaman chatan sama dia apa?, Dia sering ngirimin sriker yang berbau Jomok (Ini pelesetan ya tau lah dari pelesetan apa) itu juga mendistract aku nanya kedia dengan sontak 'Lu Jomok ya' tau apa jawaban dia 'Hmmm dipertanyakan', Shidddddddd itu kan dari sana udah jelas wah ini orang emang nggak bener, Sebenernya enaknya ngobrolin kek ginian tuh secara langsung gitu cuman ya karena aku tau kamu jarang ada waktu luang sekalipun ada aku nya yang nggak ada.",
        "Part 4": "Semenjak itu aku udah ngurang ngurangin kontak terus jalan sama dia orang-orang kan udah tau ya aku deket sama dia dalam tanda kutip ya nah karena aku udah nanyain ke..COMING SOON"

      };

      let currentDate = "13 September 2024";
      let text = textsByDate[currentDate];
      let textParts = text.split(/(?<=[.,])/);
      let partIndex = parseInt(localStorage.getItem('partIndex')) || 0;
      let typingSound;
      let calmMusic;

      function startBackgroundMusic() {
        calmMusic = new Audio('https://www.bensound.com/bensound-music/bensound-slowmotion.mp3');
        calmMusic.loop = true;
        calmMusic.play();

        // Menambahkan event listener untuk mengatasi autoplay
        document.addEventListener('click', () => {
          calmMusic.play().catch(error => {
            console.log('Autoplay failed, user interaction needed.');
          });
        }, { once: true }); // Only add this listener once
      }

      function stopBackgroundMusic() {
        if (calmMusic) calmMusic.pause();
      }

      function startTypewriter() {
        const noteDiv = document.querySelector(".typewriter-text");
        noteDiv.textContent = ""; 
        typingSound = new Audio('https://www.myinstants.com/media/sounds/keyboard-typing-sound-effect.mp3');
        typingSound.loop = true;
        typingSound.play();

        type(noteDiv);
      }

      function type(noteDiv) {
        let currentPart = textParts[partIndex];
        let currentIndex = 0;

        function typeChar() {
          if (currentIndex < currentPart.length) {
            noteDiv.textContent += currentPart.charAt(currentIndex);
            currentIndex++;
            setTimeout(typeChar, 100);
          } else {
            typingSound.pause();
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('prevBtn').style.display = partIndex > 0 ? 'block' : 'none';
            if (currentPart.endsWith('.') || currentPart.endsWith('>')) {
              showBersambung();
            }
          }
        }

        typeChar();
      }

      function showBersambung() {
        const bersambungDiv = document.querySelector(".bersambung");
        if (!bersambungDiv) {
          const newBersambungDiv = document.createElement("div");
          newBersambungDiv.textContent = "Bersambung...";
          newBersambungDiv.classList.add("animate-pulse", "text-center", "text-2xl", "font-bold", "text-primary", "bersambung");
          document.querySelector(".bg-card").appendChild(newBersambungDiv);
        }
      }

      function clearBersambung() {
        const bersambungDiv = document.querySelector(".bersambung");
        if (bersambungDiv) bersambungDiv.remove();
      }

      function showNextText() {
        clearBersambung();
        partIndex++;
        if (partIndex < textParts.length) {
          const noteDiv = document.querySelector(".typewriter-text");
          document.getElementById('nextBtn').style.display = 'none';
          noteDiv.textContent = "";
          typingSound.play();
          type(noteDiv);
        } else {
          partIndex = 0;
          localStorage.setItem('partIndex', partIndex);
          showBersambung();
          setTimeout(() => {
            const nextDate = getNextDate(currentDate);
            if (nextDate) {
              currentDate = nextDate;
              text = textsByDate[currentDate];
              textParts = text.split(/(?<=[.,])/);
              document.querySelector(".text-lg").textContent = `Today note ${currentDate}`;
              clearBersambung();
              startTypewriter();
            }
          }, 2000); 
        }
        localStorage.setItem('partIndex', partIndex);
      }

      function showPreviousText() {
        if (partIndex > 0) {
          partIndex--;
          localStorage.setItem('partIndex', partIndex);
          const noteDiv = document.querySelector(".typewriter-text");
          document.getElementById('nextBtn').style.display = 'none';
          noteDiv.textContent = "";
          typingSound.play();
          type(noteDiv);
        }
      }

      function getNextDate(current) {
        const dates = Object.keys(textsByDate);
        const currentIndex = dates.indexOf(current);
        return dates[currentIndex + 1] || null;
      }

      function takeScreenshot() {
        const element = document.querySelector(".bg-card");
        html2canvas(element).then(canvas => {
          const link = document.createElement('a');
          link.download = 'screenshot.png';
          link.href = canvas.toDataURL();
          link.click();
        });
      }

      window.onload = function() {
        startTypewriter();
        // Memastikan pemutaran musik tidak dimulai secara otomatis
        // Mulai musik hanya setelah pengguna melakukan interaksi
      };
    </script>

    <style type="text/tailwindcss">
      @layer base {
        :root {
          --background: 0 0% 100%;
          --foreground: 240 10% 3.9%;
          --card: 0 0% 100%;
          --card-foreground: 240 10% 3.9%;
        }
        .dark {
          --background: 240 10% 3.9%;
          --foreground: 0 0% 98%;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg-card p-4 rounded-lg shadow-md">
      <h2 class="text-lg font-semibold text-foreground">Today note 13 September 2024</h2>

      <div contenteditable="false" class="typewriter-text w-full h-32 p-2 border border-border rounded-lg focus:outline-none focus:ring focus:ring-ring overflow-hidden"></div>
      <div class="flex justify-between mt-2">
        <button id="prevBtn" class="btn-primary" onclick="showPreviousText()" style="display:none;">Previous</button>
        <button id="nextBtn" class="btn-primary" onclick="showNextText()">Next</button>
      </div>
      <div class="flex justify-end mt-2">
        <button onclick="takeScreenshot()" class="btn-primary">Take Screenshot</button>
      </div>
    </div>
    <footer class="text-center p-4 bg-muted text-muted-foreground">Please read without skip</footer>
    <footer class="text-center p-4 bg-muted text-muted-foreground">Made by Kurumi with❤️</footer>
  </body>
</html>
