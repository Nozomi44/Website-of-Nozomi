<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KanjiQuiz - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="title">🌸 KanjiQuiz</h1>
      <p class="subtitle">Belajar Kanji jadi lebih mudah!</p>
      <div class="login-buttons">
        <button class="btn" id="google-login">🔵 Login with Google</button>
        <button class="btn" id="facebook-login">🔷 Login with Facebook</button>
        <button class="btn" id="phone-login">📱 Login with Phone</button>
        <button class="btn ghost" id="guest-login">👤 Continue as Guest</button>
      </div>
    </div>
  </div>

  <!-- Load Firebase & Auth script SETELAH elemen ada -->
  <script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
